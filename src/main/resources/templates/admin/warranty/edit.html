<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: .warranty-form})}">
<head>
    <title>Cập nhật Bảo Hành - ChaosCoders</title>
</head>
<body>

<div class="warranty-form">
    <h2 class="fw-bold text-dark mb-4">Cập nhật Phiếu: <span th:text="${warranty.warrantyCode}"></span></h2>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/admin/warranties/save}" th:object="${warranty}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted">Khách hàng</label>
                        <input type="text" class="form-control bg-light" th:value="*{user?.fullname}" disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-muted">Sản phẩm</label>
                        <input type="text" class="form-control bg-light" th:value="*{product?.productName}" disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="ACTIVE">Đang bảo hành (ACTIVE)</option>
                            <option value="EXPIRED">Hết hạn (EXPIRED)</option>
                            <option value="VOID">Từ chối (VOID)</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ngày hết hạn</label>
                        <input type="datetime-local" class="form-control" th:field="*{expirationDate}" required>
                    </div>
                </div>

                <div class="mt-4 border-top pt-3 text-end">
                    <a th:href="@{/admin/warranties}" class="btn btn-light me-2">Quay lại</a>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
