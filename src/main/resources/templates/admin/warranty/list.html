<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: .warranty-content})}">
<head>
    <title>Quản lý Bảo Hành - ChaosCoders</title>
</head>
<body>

<div class="warranty-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Danh sách Bảo Hành</h2>
        <a th:href="@{/admin/warranties/scan}" class="btn btn-warning shadow-sm">
            <i class="fas fa-envelope-open-text me-1"></i> Quét & Gửi Mail Nhắc Nhở
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <form th:action="@{/admin/warranties}" method="get" class="d-flex w-50">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Nhập mã BH, tên KH, SĐT hoặc Tên máy...">
                <button type="submit" class="btn btn-outline-secondary">Tìm</button>
                <a th:href="@{/admin/warranties}" class="btn btn-outline-danger ms-2">Xóa</a>
            </form>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Mã BH</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>Gói BH</th>
                        <th>Hạn bảo hành</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="w : ${warranties}">
                        <td class="fw-bold text-primary" th:text="${w.warrantyCode}"></td>
                        <td>
                            <div th:text="${w.user?.fullname}"></div>
                            <small class="text-muted" th:text="${w.user?.phone}"></small>
                        </td>
                        <td th:text="${w.product?.productName}"></td>
                        <td th:text="${w.warrantyPolicy?.policyName}"></td>
                        <td th:text="${#temporals.format(w.expirationDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${w.status == 'ACTIVE' ? 'bg-success' : (w.status == 'EXPIRED' ? 'bg-warning' : 'bg-danger')}"
                                      th:text="${w.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/warranties/edit/{id}(id=${w.id})}" class="btn btn-sm btn-outline-primary" title="Cập nhật">
                                <i class="fas fa-edit"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(warranties)}">
                        <td colspan="7" class="text-center text-muted py-4">Không tìm thấy dữ liệu bảo hành nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
