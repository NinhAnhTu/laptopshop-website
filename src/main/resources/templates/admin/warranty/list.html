<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: .warranty-content})}">
<head>
    <title>Quản lý phiếu bảo hành - ChaosCoders</title>
</head>
<body>

<div class="warranty-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Danh sách phiếu bảo hành</h2>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <form th:action="@{/admin/warranties}" method="get" class="d-flex w-50">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Nhập mã BH, tên KH, SĐT hoặc Tên máy...">
                <button type="submit" class="btn btn-outline-secondary">Tìm</button>
                <a th:href="@{/admin/warranties}" class="btn btn-outline-danger ms-2">Xóa</a>
            </form>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Mã BH</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>Gói bảo hành</th>
                        <th>Hạn bảo hành</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="w : ${warranties}">
                        <td class="fw-bold text-primary" th:text="${w.warrantyCode}"></td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${w.product?.productName}"></div>

                            <small class="text-muted"
                                   th:text="${w.purchaseDate != null ? 'Ngày kích hoạt: ' + #temporals.format(w.purchaseDate, 'dd/MM/yyyy') : 'Ngày kích hoạt: Đang cập nhật'}">
                            </small>
                        </td>
                        <td th:text="${w.warrantyPolicy?.policyName}"></td>

                        <td class="fw-bold"
                            th:text="${w.expirationDate != null ? #temporals.format(w.expirationDate, 'dd/MM/yyyy') : 'Chưa xác định'}">
                        </td>

                        <td>
                                                <span class="badge rounded-pill px-3 py-2"
                                                      th:classappend="${w.status == 'ACTIVE' ? 'bg-success' : (w.status == 'EXPIRED' ? 'bg-warning text-dark' : 'bg-danger')}"
                                                      th:text="${w.status != null ? w.status : 'UNKNOWN'}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
