<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: .content-body})}">
<head>
    <title>Thêm chính sách bảo hành - ChaosCoders</title>
</head>
<body>

<div class="content-body">

    <!-- Header & Nút Quay Lại -->
    <div class="d-flex justify-content-between align-items-center mb-4 pt-3">
        <div>
            <h2 class="fw-bold text-dark mb-0">Thêm mới chính sách bảo hành</h2>
            <small class="text-muted">Quản lý các quy định và thời hạn bảo hành cho sản phẩm</small>
        </div>
        <a th:href="@{/admin/warranty-policies}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fas fa-arrow-left me-2"></i>Quay lại danh sách
        </a>
    </div>

    <!-- Khối Nội Dung Form -->
    <div class="card border-0 shadow-sm rounded-4" style="max-width: 900px; margin: 0 auto;">
        <div class="card-body p-4">
            <form th:action="@{/admin/warranty-policies/save}" th:object="${policy}" method="post">

                <div class="row g-4">
                    <div class="col-12">
                        <h6 class="fw-bold text-secondary text-uppercase mb-3">
                            <i class="fas fa-info-circle me-2"></i>Thông tin chi tiết
                        </h6>

                        <div class="row g-3">
                            <!-- Tên Chính Sách -->
                            <div class="col-md-8">
                                <label class="form-label fw-bold small text-muted">Tên chính sách <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-shield-alt text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 py-2 fw-bold"
                                           th:field="*{policyName}" required placeholder="Ví dụ: Bảo hành VIP 24 tháng...">
                                </div>
                            </div>

                            <!-- Thời Hạn -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold small text-muted">Thời hạn (Số tháng) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="far fa-calendar-alt text-muted"></i></span>
                                    <input type="number" class="form-control border-start-0 py-2 fw-bold text-primary"
                                           th:field="*{durationMonths}" required min="1" placeholder="Ví dụ: 12">
                                </div>
                            </div>

                            <!-- Mô Tả -->
                            <div class="col-md-12 mt-4">
                                <label class="form-label fw-bold small text-muted">Mô tả chi tiết</label>
                                <textarea class="form-control bg-light border-0 py-3"
                                          th:field="*{description}" rows="5"
                                          placeholder="Nhập các điều khoản, quy định bảo hành, các lỗi được áp dụng..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                    <a th:href="@{/admin/warranty-policies}" class="btn btn-light rounded-pill px-4 fw-bold">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold"
                            style="background-color: #f37021; border-color: #f37021;">
                        <i class="fas fa-save me-2"></i>Lưu lại
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- QUAN TRỌNG: script phải nằm BÊN TRONG .content-body, nếu không layout sẽ bỏ đi -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            // Lỗi từ server (trùng tên, thời hạn không hợp lệ...)
            const errorMessage = /*[[${errorMessage}]]*/ null;
            if (errorMessage && errorMessage.trim() !== '') {
                Swal.fire({
                    icon: 'error',
                    title: 'Không hợp lệ!',
                    text: errorMessage,
                    confirmButtonColor: '#f37021',
                    customClass: { popup: 'rounded-4' }
                });
            }
        });
    </script>
</div>

</body>
</html>
