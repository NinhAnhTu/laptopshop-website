<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: .content-body})}">
<head>
    <title>Thêm sản phẩm mới - ChaosCoders</title>
</head>
<body>

<div class="content-body">

    <div class="d-flex justify-content-between align-items-center mb-4 pt-3">
        <div>
            <h2 class="fw-bold text-dark mb-0">Thêm sản phẩm mới</h2>
            <small class="text-muted"></small>
        </div>
        <a href="/admin/products" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fas fa-arrow-left me-2"></i>Quay lại danh sách
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/admin/products/create}"
                  th:object="${productDTO}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="row g-4">

                    <div class="col-lg-8">
                        <h6 class="fw-bold text-secondary text-uppercase mb-3">
                            <i class="fas fa-info-circle me-2"></i>Thông tin chung
                        </h6>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{productName}" class="form-control py-2 fw-bold" required>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Giá gốc (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" th:field="*{originalPrice}" class="form-control py-2" min="1"
                                           th:classappend="${#fields.hasErrors('originalPrice')} ? 'is-invalid'" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('originalPrice')}"
                                         th:errors="*{originalPrice}"></div>
                                    <span class="input-group-text bg-light text-muted">đ</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" th:field="*{salePrice}" class="form-control py-2 fw-bold text-danger" required>
                                    <span class="input-group-text bg-light text-muted">đ</span>
                                </div>
                            </div>
                        </div>

                        <h6 class="fw-bold text-secondary text-uppercase mb-3 mt-4">
                            <i class="fas fa-microchip me-2"></i>Cấu hình chi tiết
                        </h6>

                        <div id="specs-laptop" class="specs-block row g-3 bg-light p-3 rounded-4 border border-dashed">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">CPU</label>
                                <input type="text" th:field="*{cpu}" class="form-control" placeholder="Core i7 1165G7...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">RAM</label>
                                <input type="text" th:field="*{ram}" class="form-control" placeholder="16GB LPDDR4x...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Ổ cứng (Storage)</label>
                                <input type="text" th:field="*{storage}" class="form-control" placeholder="512GB NVMe SSD...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Card đồ họa (GPU)</label>
                                <input type="text" th:field="*{gpu}" class="form-control" placeholder="Intel Iris Xe...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">Màn hình (inch)</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" th:field="*{screen}" class="form-control" placeholder="15.6">
                                    <span class="input-group-text bg-white text-muted">inch</span>
                                </div>
                            </div>
                        </div>

                        <div id="specs-ram" class="specs-block row g-3 bg-light p-3 rounded-4 border border-dashed d-none">
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Dung lượng</label><input type="text" th:field="*{ramCapacity}" class="form-control" placeholder="VD: 16GB"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Loại RAM</label><input type="text" th:field="*{ramType}" class="form-control" placeholder="VD: DDR4"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Bus Speed</label><input type="text" th:field="*{busSpeed}" class="form-control" placeholder="VD: 3200MHz"></div>
                        </div>

                        <div id="specs-storage" class="specs-block row g-3 bg-light p-3 rounded-4 border border-dashed d-none">
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">Dung lượng</label><input type="text" th:field="*{storageCapacity}" class="form-control" placeholder="VD: 500GB"></div>
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">Loại ổ cứng</label><input type="text" th:field="*{storageType}" class="form-control" placeholder="VD: SSD"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Chuẩn giao tiếp</label><input type="text" th:field="*{formFactor}" class="form-control" placeholder="VD: M.2 NVMe"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Tốc độ đọc</label><input type="text" th:field="*{readSpeed}" class="form-control" placeholder="VD: 3500 MB/s"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Tốc độ ghi</label><input type="text" th:field="*{writeSpeed}" class="form-control" placeholder="VD: 3000 MB/s"></div>
                        </div>

                        <div id="specs-cpu" class="specs-block row g-3 bg-light p-3 rounded-4 border border-dashed d-none">
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Socket</label><input type="text" th:field="*{socketType}" class="form-control" placeholder="VD: LGA1700"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Số nhân</label><input type="number" th:field="*{cores}" class="form-control" placeholder="VD: 6"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Số luồng</label><input type="number" th:field="*{threads}" class="form-control" placeholder="VD: 12"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Xung nhịp cơ bản</label><input type="text" th:field="*{baseClock}" class="form-control" placeholder="VD: 2.5 GHz"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Xung nhịp tối đa</label><input type="text" th:field="*{boostClock}" class="form-control" placeholder="VD: 4.4 GHz"></div>
                            <div class="col-md-4"><label class="form-label small fw-bold text-muted">Công suất (TDP)</label><input type="text" th:field="*{tdp}" class="form-control" placeholder="VD: 65W"></div>
                        </div>

                        <div id="specs-vga" class="specs-block row g-3 bg-light p-3 rounded-4 border border-dashed d-none">
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">GPU Chip</label><input type="text" th:field="*{gpuChip}" class="form-control" placeholder="VD: RTX 3060"></div>
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">Nguồn đề xuất</label><input type="text" th:field="*{powerRecommended}" class="form-control" placeholder="VD: 550W"></div>
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">Dung lượng VRAM</label><input type="text" th:field="*{vram}" class="form-control" placeholder="VD: 12GB"></div>
                            <div class="col-md-6"><label class="form-label small fw-bold text-muted">Loại VRAM</label><input type="text" th:field="*{vramType}" class="form-control" placeholder="VD: GDDR6"></div>
                        </div>
                    </div>

                    <div class="col-lg-4 border-start-lg">
                        <h6 class="fw-bold text-secondary text-uppercase mb-3">
                            <i class="fas fa-tags me-2"></i>Phân loại & Kho
                        </h6>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Danh mục</label>
                            <select th:field="*{categoryId}" class="form-select py-2">
                                <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Thương hiệu</label>
                            <select th:field="*{brandId}" class="form-select py-2">
                                <option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.brandName}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Bảo hành</label>
                            <select th:field="*{warrantyPolicyId}" class="form-select py-2">
                                <option th:each="w : ${warranties}" th:value="${w.warrantyId}" th:text="${w.policyName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Trạng thái ban đầu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-secondary-subtle text-secondary border-secondary-subtle"><i class="fas fa-eye-slash"></i></span>
                                <input type="text" class="form-control py-2 bg-light text-secondary fw-bold" value="Tạm ẩn (Bản nháp)" readonly>
                            </div>
                            <div class="form-text small"><i class="fas fa-info-circle me-1 text-primary"></i>Hệ thống sẽ lưu nháp. Bạn có thể bật bán ở trang Cập nhật sau khi kiểm tra kỹ thông tin.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Số lượng</label>
                            <div class="input-group">
                                <span class="input-group-text bg-secondary-subtle"><i class="fas fa-boxes"></i></span>
                                <input type="number" class="form-control py-2 fw-bold bg-light text-secondary" value="0" readonly>
                            </div>
                            <div class="form-text small text-danger"><i class="fas fa-lock me-1"></i> Nhập kho để tăng số lượng</div>
                        </div>

                        <hr class="text-muted opacity-25">

                        <h6 class="fw-bold text-secondary text-uppercase mb-3">
                            <i class="fas fa-images me-2"></i>Hình ảnh
                        </h6>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Ảnh đại diện (Thumbnail)</label>
                            <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Ảnh chi tiết (Nhiều ảnh)</label>
                            <input type="file" th:field="*{detailFiles}" class="form-control" accept="image/*" multiple>
                            <div class="form-text small">Giữ phím Ctrl để chọn nhiều file.</div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/admin/products" class="btn btn-light rounded-pill px-4 fw-bold">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold"
                            style="background-color: #f37021; border-color: #f37021;">
                        <i class="fas fa-save me-2"></i>Lưu sản phẩm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lấy dropdown Danh mục thông qua id do Thymeleaf tự sinh ra
            const categorySelect = document.getElementById('categoryId');

            if (!categorySelect) return;

            function updateSpecsForm() {
                // 1. Ẩn tất cả các khối cấu hình (những div có class specs-block)
                document.querySelectorAll('.specs-block').forEach(el => el.classList.add('d-none'));

                // 2. Lấy ID danh mục đang chọn
                const catId = parseInt(categorySelect.value);

                // 3. Hiển thị khối tương ứng dựa theo ID trong DB
                if ([1, 2, 3].includes(catId)) {        // Macbook, Laptop Gaming, Laptop Văn Phòng
                    document.getElementById('specs-laptop').classList.remove('d-none');
                } else if (catId === 4) {               // RAM  (cũ: 6)
                    document.getElementById('specs-ram').classList.remove('d-none');
                } else if (catId === 5) {               // Ổ cứng SSD/HDD  (cũ: 7)
                    document.getElementById('specs-storage').classList.remove('d-none');
                } else if (catId === 6) {               // CPU  (cũ: 8)
                    document.getElementById('specs-cpu').classList.remove('d-none');
                } else if (catId === 7) {               // VGA  (cũ: 9)
                    document.getElementById('specs-vga').classList.remove('d-none');
                } else {
                    document.getElementById('specs-laptop').classList.remove('d-none');
                }
            }

            // Chạy ngay lần đầu khi tải trang
            updateSpecsForm();

            // Lắng nghe thao tác thay đổi danh mục của Admin
            categorySelect.addEventListener('change', updateSpecsForm);
        });
    </script>

</div> </body>
</html>
