<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cấu Hình PC Build Sẵn - ChaosCoders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .preset-container { max-width: 1300px; margin: 2rem auto; }
        .preset-card { border: none; border-radius: 12px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
        .preset-card:hover { transform: translateY(-4px); box-shadow: 0 .5rem 1.2rem rgba(0,0,0,.15) !important; }
        .preset-img { height: 220px; object-fit: contain; background: #fff; padding: 12px; }
        .preset-name { font-weight: 700; color: #333; min-height: 2.8rem; }
        .key-item { font-size: .85rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preset-price { color: #dc3545; font-weight: 800; font-size: 1.35rem; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container preset-container">
    <div class="row mb-3 align-items-center">
        <div class="col">
            <h2 class="fw-bold text-dark mb-1">Cấu Hình PC Build Sẵn</h2>
            <div class="text-muted">Chọn nhanh bộ PC đã được tư vấn sẵn, mua trọn bộ chỉ với một cú bấm.</div>
        </div>
        <div class="col-auto">
            <a th:href="@{/pc-builder}" class="btn btn-outline-primary rounded-pill fw-bold">
                <i class="fas fa-tools me-1"></i> Tự build cấu hình
            </a>
        </div>
    </div>

    <!-- Lọc theo nhãn -->
    <div class="mb-4" th:if="${!#lists.isEmpty(tags)}">
        <a th:href="@{/pc-presets}"
           class="btn btn-sm rounded-pill me-1"
           th:classappend="${selectedTag == null || selectedTag == ''} ? 'btn-primary' : 'btn-outline-secondary'">Tất cả</a>
        <a th:each="t : ${tags}"
           th:href="@{/pc-presets(tag=${t})}"
           th:text="${t}"
           class="btn btn-sm rounded-pill me-1"
           th:classappend="${t == selectedTag} ? 'btn-primary' : 'btn-outline-secondary'"></a>
    </div>

    <div class="alert alert-light border text-center" th:if="${#lists.isEmpty(presets)}">
        Hiện chưa có cấu hình build sẵn nào.
    </div>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" th:each="preset : ${presets}">
            <div class="card preset-card shadow-sm h-100">
                <a th:href="@{'/pc-presets/' + ${preset.slug}}">
                    <img th:src="${preset.resolveImageUrl()}" th:alt="${preset.name}" class="card-img-top preset-img">
                </a>
                <div class="card-body d-flex flex-column">
                    <div class="mb-2" th:if="${preset.tag != null}">
                        <span class="badge bg-primary" th:text="${preset.tag}"></span>
                    </div>
                    <a th:href="@{'/pc-presets/' + ${preset.slug}}" class="text-decoration-none">
                        <div class="preset-name" th:text="${preset.name}"></div>
                    </a>

                    <!-- Linh kiện chính -->
                    <div class="my-2">
                        <div class="key-item" th:each="it : ${preset.keyItems()}"
                             th:text="${it.product.productName}"></div>
                    </div>

                    <div class="mt-auto d-flex justify-content-between align-items-center pt-2">
                        <div class="preset-price"
                             th:text="${#numbers.formatDecimal(preset.calcTotalPrice(), 0, 'POINT', 0, 'COMMA')} + ' đ'"></div>
                        <span class="badge bg-secondary" th:if="${preset.calcAvailableQty() <= 0}">Tạm hết hàng</span>
                        <a th:href="@{'/pc-presets/' + ${preset.slug}}"
                           th:if="${preset.calcAvailableQty() > 0}"
                           class="btn btn-primary rounded-pill btn-sm fw-bold px-3">Xem chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
