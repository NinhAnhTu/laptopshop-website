<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng - ChaosCoders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-img { width: 70px; height: 70px; object-fit: contain; border: 1px solid #eee; border-radius: 10px; padding: 5px; background: white;}
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <a href="/account" class="text-decoration-none text-muted mb-2 d-block"><i class="fas fa-arrow-left me-1"></i> Quay lại tài khoản</a>
            <h3 class="fw-bold text-dark">Chi tiết đơn hàng #<span th:text="${order.orderId}"></span></h3>
            <span class="badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill" th:text="${order.status}">Chờ xác nhận</span>
        </div>
        <div class="text-end text-muted small">
            <div>Ngày đặt: <span class="fw-bold" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card card-custom p-4 mb-4">
                <h5 class="fw-bold mb-4 border-bottom pb-2"><i class="fas fa-box-open me-2 text-primary"></i>Danh sách sản phẩm</h5>

                <div class="d-flex align-items-center mb-3" th:each="detail : ${order.orderDetails}">
                    <img th:if="${not #lists.isEmpty(detail.product.images)}" th:src="${detail.product.images[0].url}" class="product-img me-3">
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1" th:text="${detail.product.productName}">Tên Laptop</h6>
                        <div class="text-muted small">Số lượng: <span th:text="${detail.quantity}"></span></div>
                    </div>
                    <div class="fw-bold text-danger" th:text="${#numbers.formatDecimal(detail.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                </div>
            </div>

            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="fas fa-map-marked-alt me-2 text-primary"></i>Thông tin nhận hàng</h5>
                <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${order.shippingName}"></span></p>
                <p class="mb-1"><strong>Điện thoại:</strong> <span th:text="${order.shippingPhone}"></span></p>
                <p class="mb-1"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress} + ', ' + ${order.shippingCity.cityName}"></span></p>
                <p class="mb-0 text-muted fst-italic"><strong>Ghi chú:</strong> <span th:text="${order.note != null and order.note != '' ? order.note : 'Không có'}"></span></p>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card card-custom p-4 bg-white sticky-top" style="top: 20px;">
                <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="fas fa-receipt me-2 text-primary"></i>Tổng quan</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tổng tiền hàng:</span>
                    <span class="fw-bold" th:text="${#numbers.formatDecimal(order.totalProductsPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Phí vận chuyển:</span>
                    <span class="fw-bold" th:text="'+ ' + ${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>
                <div class="d-flex justify-content-between mb-3 text-success">
                    <span>Voucher giảm giá:</span>
                    <span class="fw-bold" th:text="'- ' + ${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>

                <hr>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold fs-5">Thành tiền:</span>
                    <span class="fs-4 fw-bold text-danger" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>

                <div class="alert alert-secondary mb-0 small text-center rounded-3">
                    <i class="fas fa-credit-card me-1"></i> Phương thức:
                    <strong th:text="${order.paymentMethod.methodName}"></strong>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
